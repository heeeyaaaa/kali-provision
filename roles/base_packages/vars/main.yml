# Non-default apt packages: what this box has that a fresh Kali does not.
# apt-mark showmanual minus roles/base_packages/files/kali-default-packages.txt,
# minus kernels and a small drop-list, plus REQUIRED_EXTRA below.
# Generated on 2026-09-08.
# ad1tools is a local .deb (artifacts_sync); packages-microsoft-prod conflicts
# with the microsoft repo apt_repos configures; tlauncher is non-pentest;
# wine/wine32:i386/libwine/libwine:i386 unused and i386 multiarch was never
# enabled anywhere, so the :i386 variants could never install anyway.
