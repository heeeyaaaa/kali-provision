---
- name: Deploy shell and editor dotfiles
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ansible_env.HOME }}/{{ item }}"
    mode: "0644"
    backup: true
  loop: "{{ dotfiles | default([]) }}"

- name: Ensure ~/.local/bin and toolchain dirs are on PATH
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zshrc"
    create: true
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED - kali-provision PATH"
    block: |
      export PATH="$HOME/.local/bin:$HOME/go/bin:$HOME/.cargo/bin:$PATH"
      export PATH="$HOME/tools/hashcat:$HOME/.npm-global/bin:$PATH"
      export PATH="$HOME/tools/google-cloud-sdk/bin:$PATH"

- name: Ensure XFCE xfconf directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/xfce4/xfconf/xfce-perchannel-xml"
    state: directory
    mode: "0700"

- name: Deploy XFCE screensaver / power settings (disable screen lock and blanking)
  ansible.builtin.copy:
    src: "xfconf/{{ item }}"
    dest: "{{ ansible_env.HOME }}/.config/xfce4/xfconf/xfce-perchannel-xml/{{ item }}"
    mode: "0644"
  loop:
    - xfce4-screensaver.xml
    - xfce4-power-manager.xml
