[defaults]
host_key_checking = False
inventory = inventory.ini
roles_path = roles
stdout_callback = default
callback_result_format = yaml
# Persists everything the stdout callback prints to a file, appended across
# runs, not rotated.
log_path = ./ansible.log
nocows = 1
# Pins the interpreter to the stable /usr/bin/python3 symlink rather than
# auto_silent's cached version-pinned path, which can go stale mid-run if a
# package purge orphans that specific python3.x. Also covers Packer's
# ansible provisioner, which builds its own throwaway inventory.
interpreter_python = /usr/bin/python3
retry_files_enabled = False

[privilege_escalation]
# su (not sudo) needs root's own password rather than a standing NOPASSWD
# sudoers grant -- see bootstrap.yml and packer/kali.pkr.hcl, which set
# root's password during the one-time bootstrap/build step. For a remote
# target, pass -K to be prompted for it.
become_method = su
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=300s -o ServerAliveInterval=30
