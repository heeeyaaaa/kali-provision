# Provision the machine Ansible is running on.
[local]
localhost ansible_connection=local

# Provision a fresh Kali VM over SSH. Set the IP after the VM's first boot.
# Find it from the host with:  vmrun getGuestIPAddress <path-to-vmx>
# or from inside the VM with:  ip -4 -o addr show
[kali]
# kali-new ansible_host=172.16.138.0 ansible_user=kali

[kali:vars]
ansible_python_interpreter=/usr/bin/python3
